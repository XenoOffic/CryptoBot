<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Cryptolytics
    </title>

    <link
        rel="stylesheet"
        href="/static/css/main.css"
    >

</head>

<body>

    <div class="app-shell">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="brand">

                <div class="brand-mark">
                    C
                </div>

                <div>
                    <h1>
                        Cryptolytics
                    </h1>

                    <span>
                        Market Intelligence
                    </span>
                </div>

            </div>


            <div class="sidebar-section">

                <label>
                    Cryptocurrency
                </label>

                <input
                    id="symbol-input"
                    type="text"
                    value="BTC"
                    placeholder="BTC"
                >

                <button
                    id="analyze-button"
                    type="button"
                >
                    Analyze
                </button>

            </div>


            <div class="sidebar-section">

                <label>
                    Time range
                </label>

                <div class="time-buttons">

                    <button data-days="1">
                        1D
                    </button>

                    <button data-days="7">
                        7D
                    </button>

                    <button data-days="30" class="active">
                        30D
                    </button>

                    <button data-days="90">
                        90D
                    </button>

                    <button data-days="365">
                        1Y
                    </button>

                </div>

            </div>


            <div class="system-status">

                <span class="status-dot"></span>

                <span>
                    Analysis engine online
                </span>

            </div>

        </aside>


        <!-- MAIN -->

        <main class="main-content">

            <header class="topbar">

                <div>

                    <span class="eyebrow">
                        MARKET OVERVIEW
                    </span>

                    <h2 id="market-symbol">
                        BTC / USD
                    </h2>

                </div>


                <div
                    id="loading-status"
                    class="loading-status"
                >
                    Ready
                </div>

            </header>


            <!-- MARKET CARDS -->

            <section class="market-grid">

                <div class="metric-card">

                    <span>
                        Price
                    </span>

                    <strong id="price">
                        —
                    </strong>

                </div>


                <div class="metric-card">

                    <span>
                        24h Change
                    </span>

                    <strong id="change">
                        —
                    </strong>

                </div>


                <div class="metric-card">

                    <span>
                        Market Cap
                    </span>

                    <strong id="market-cap">
                        —
                    </strong>

                </div>


                <div class="metric-card">

                    <span>
                        24h Volume
                    </span>

                    <strong id="volume">
                        —
                    </strong>

                </div>

            </section>


            <!-- CHART -->

            <section class="chart-panel">

                <div class="panel-header">

                    <div>

                        <span class="eyebrow">
                            PRICE ACTION
                        </span>

                        <h3>
                            Candlestick Chart
                        </h3>

                    </div>

                </div>


                <div
                    id="chart-container"
                    class="chart-container"
                >

                    <div class="chart-placeholder">

                        Waiting for market data...

                    </div>

                </div>

            </section>


            <!-- INDICATORS -->

            <section class="indicator-grid">

                <div class="indicator-card">

                    <span>
                        RSI 14
                    </span>

                    <strong id="rsi">
                        —
                    </strong>

                </div>


                <div class="indicator-card">

                    <span>
                        SMA 20
                    </span>

                    <strong id="sma20">
                        —
                    </strong>

                </div>


                <div class="indicator-card">

                    <span>
                        SMA 50
                    </span>

                    <strong id="sma50">
                        —
                    </strong>

                </div>


                <div class="indicator-card">

                    <span>
                        EMA 20
                    </span>

                    <strong id="ema20">
                        —
                    </strong>

                </div>


                <div class="indicator-card">

                    <span>
                        ATR 14
                    </span>

                    <strong id="atr">
                        —
                    </strong>

                </div>


                <div class="indicator-card">

                    <span>
                        Trend
                    </span>

                    <strong id="trend">
                        —
                    </strong>

                </div>

            </section>

        </main>

    </div>


    <script
        src="/static/js/state.js"
    ></script>

    <script
        src="/static/js/api.js"
    ></script>

    <script
        src="/static/js/chart.js"
    ></script>

    <script
        src="/static/js/app.js"
    ></script>

</body>

                            </html>
